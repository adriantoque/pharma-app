<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#F2F6F5;--panel:#FFFFFF;--ink:#16303A;--mute:#5B7079;--line:#D5E0DE;--brand:#0E5A52;--brand-soft:#D7ECE8;--warn:#B7791F;--bad:#B3362F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E22;--panel:#16292E;--ink:#E3EEEC;--mute:#93AAA7;--line:#25403F;--brand:#5CC7B5;--brand-soft:#1B3A38;--warn:#E3A93B;--bad:#EE7B72}}
:root[data-theme="dark"]{--bg:#0F1E22;--panel:#16292E;--ink:#E3EEEC;--mute:#93AAA7;--line:#25403F;--brand:#5CC7B5;--brand-soft:#1B3A38;--warn:#E3A93B;--bad:#EE7B72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif}
h1{font-size:1.7rem;margin:0}
h2{font-size:1.1rem;margin:0 0 12px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;margin-bottom:16px}
header p{margin:2px 0 0;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
button{font:inherit;color:var(--ink);background:none;border:0;padding:8px 14px;cursor:pointer}
button[aria-pressed="true"],button[aria-selected="true"]{background:var(--brand);color:#fff}
button:focus-visible{outline:3px solid var(--warn);outline-offset:-3px}
nav[role=tablist]{margin:18px 0 14px}
.sales-hero{background:var(--brand);color:#fff;border-radius:14px;padding:20px;margin-bottom:14px}
.sales-hero .big{font-size:2.6rem;font-weight:700;line-height:1.1}
.sales-hero small{opacity:.85}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.facts b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.cols{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}
.bars{display:flex;align-items:end;gap:3px;height:140px;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}
.axis{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin-top:4px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .m{color:var(--mute);font-size:.9rem}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--brand-soft);overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand)}
.tag{font-size:.85rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.bad{color:var(--bad)}.warn{color:var(--warn)}
.note{color:var(--mute);font-size:.9rem;margin-top:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Reports</h1><p>Sales, stock and expiry at a glance</p></div>
  <div class="seg" id="range" role="group" aria-label="Date range">
    <button data-r="1" aria-pressed="false">Today</button>
    <button data-r="7" aria-pressed="true">7 days</button>
    <button data-r="30" aria-pressed="false">30 days</button>
  </div>
</header>

<nav role="tablist" class="seg" id="tabs">
  <button role="tab" data-t="sales" aria-selected="true">Sales</button>
  <button role="tab" data-t="stock" aria-selected="false">Low stock</button>
  <button role="tab" data-t="expiry" aria-selected="false">Expiring</button>
</nav>

<section id="sales">
  <div class="sales-hero">
    <small id="rangeLabel"></small>
    <div class="big" id="total"></div>
    <div class="facts">
      <div><small>Profit</small><b id="profit"></b></div>
      <div><small>Customers served</small><b id="count"></b></div>
      <div><small>Average bill</small><b id="avg"></b></div>
    </div>
  </div>
  <div class="panel"><h2>Daily sales</h2><div class="bars" id="bars"></div><div class="axis"><span id="from"></span><span>Today</span></div></div>
  <div class="cols">
    <div class="panel"><h2>Best sellers</h2><div id="top"></div></div>
    <div class="panel"><h2>Sales by category</h2><div id="cats"></div></div>
  </div>
</section>

<section id="stock" hidden>
  <div class="panel"><h2>Reorder soon</h2><div id="lowList"></div></div>
</section>

<section id="expiry" hidden>
  <div class="panel"><h2>Expiring within 90 days</h2><div id="expList"></div></div>
</section>

<p class="note">Sample figures shown. Connect your sales and inventory data to replace them.</p>
</main>

<script>
const peso=n=>"₱"+Math.round(n).toLocaleString("en-PH");
const TODAY=new Date("2026-10-02");
// 30 days of sample sales, oldest first
const daily=Array.from({length:30},(_,i)=>{const d=(i*37)%11;return 14500+d*900+(i%7>4?2500:0)});
const top=[["Paracetamol 500mg",2140,"tabs"],["Amoxicillin 500mg",980,"caps"],["Losartan 50mg",860,"tabs"],["Vitamin C 500mg",790,"tabs"],["Cetirizine 10mg",640,"tabs"]];
const cats=[["Prescription",46],["Over-the-counter",31],["Vitamins",14],["Personal care",9]];
const low=[["Amoxicillin 500mg",12,40],["Metformin 500mg",18,60],["Salbutamol inhaler",3,10],["Mefenamic acid 500mg",25,50]];
const exp=[["Cefalexin syrup","2026-10-24",8],["Insulin glargine pen","2026-11-15",4],["Ibuprofen 400mg","2026-12-05",60],["Loperamide 2mg","2026-12-28",30]];
let range=7;
const $=id=>document.getElementById(id);
function render(){
  const s=daily.slice(-range),sum=s.reduce((a,b)=>a+b,0),cnt=Math.round(sum/340);
  $("rangeLabel").textContent=range===1?"Sales today":"Sales, last "+range+" days";
  $("total").textContent=peso(sum);$("profit").textContent=peso(sum*0.22);
  $("count").textContent=cnt.toLocaleString();$("avg").textContent=peso(sum/cnt);
  const show=range===1?daily.slice(-7):s,max=Math.max(...show);
  $("bars").innerHTML=show.map((v,i)=>`<i style="height:${v/max*100}%" title="${peso(v)}"></i>`).join("");
  $("from").textContent=range===1?"7 days ago":range+" days ago";
  const f=range;
  $("top").innerHTML=top.map(t=>`<div class="row"><span>${t[0]}</span><b>${Math.round(t[1]*f/7).toLocaleString()} ${t[2]}</b></div>`).join("");
  $("cats").innerHTML=cats.map(c=>`<div class="row"><span>${c[0]}</span><b>${c[1]}%</b><div class="meter"><span style="width:${c[1]}%"></span></div></div>`).join("");
}
$("lowList").innerHTML=low.map(l=>`<div class="row"><span>${l[0]}<div class="m">Reorder level: ${l[2]}</div></span><span class="tag bad">${l[1]} left</span></div>`).join("");
$("expList").innerHTML=exp.map(e=>{const d=Math.round((new Date(e[1])-TODAY)/864e5);
  return `<div class="row"><span>${e[0]}<div class="m">${e[2]} units, expires ${new Date(e[1]).toLocaleDateString("en-PH",{day:"numeric",month:"short",year:"numeric"})}</div></span><span class="tag ${d<45?"bad":"warn"}">${d} days</span></div>`}).join("");
$("range").onclick=e=>{const b=e.target.closest("button");if(!b)return;range=+b.dataset.r;
  document.querySelectorAll("#range button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#tabs button").forEach(x=>{x.setAttribute("aria-selected",x===b);$(x.dataset.t).hidden=x!==b});
  $("range").parentElement.style.visibility="visible"};
render();
</script>
</body>
</html>
