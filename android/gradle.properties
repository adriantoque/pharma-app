org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Run independent module tasks in parallel
org.gradle.parallel=true
# Cache task outputs across builds
org.gradle.caching=true
# Cap workers at your 4 logical CPU threads
org.gradle.workers.max=4
# Keep the daemon alive between builds
org.gradle.daemon=true

# Kotlin incremental compilation (disabled: cross-drive source roots crash it)
kotlin.incremental=false

android.useAndroidX=true
# Only relevant if no legacy support-lib plugins; keeps dependency graph smaller
android.enableJetifier=false
android.nonTransitiveRClass=true
# Flags kept from the Flutter template
android.newDsl=false
android.builtInKotlin=false